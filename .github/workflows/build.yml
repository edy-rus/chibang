name: build image
on:
  push:
    branches: [main]
    paths: [Containerfile, packages.txt, 'rootfs/**', .github/workflows/build.yml]
  schedule:
    - cron: '30 4 * * *'   # daily: picks up the latest upstream ucore-hci:stable
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialise builds so two runs on the same day can't pick the same version.
concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Version = <Fedora major>.<build date>.<n>, e.g. 45.20261122.0, where n
      # counts builds that day. The upstream version and digest go in the
      # org.opencontainers.image.base.* labels instead of the version string.
      - name: Compute version
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chibang"
          BASE=ghcr.io/ublue-os/ucore-hci:stable
          podman pull "$BASE"
          BASE_DIGEST=$(podman image inspect "$BASE" --format '{{.Digest}}')
          UPSTREAM_VERSION=$(podman image inspect "$BASE" --format '{{ index .Labels "org.opencontainers.image.version" }}')
          MAJOR=${UPSTREAM_VERSION%%.*}
          DATE=$(date -u +%Y%m%d)
          # No fallback on failure: guessing n=0 would overwrite an immutable tag.
          tags=$(skopeo list-tags "docker://$IMAGE")
          n=$(jq --arg p "$MAJOR.$DATE." '[.Tags[] | select(startswith($p))] | length' <<<"$tags")
          VERSION="$MAJOR.$DATE.$n"
          echo "Building $VERSION on $UPSTREAM_VERSION ($BASE_DIGEST)"
          {
            echo "IMAGE=$IMAGE"; echo "BASE=$BASE"; echo "BASE_DIGEST=$BASE_DIGEST"
            echo "MAJOR=$MAJOR"; echo "DATE=$DATE"; echo "VERSION=$VERSION"
          } >> "$GITHUB_ENV"

      - name: Build
        run: |
          podman build --build-arg IMAGE_REF="$IMAGE" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.title=chibang \
            --label org.opencontainers.image.description="chibang homelab server: ucore-hci plus host config" \
            --label org.opencontainers.image.url="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.base.name="$BASE" \
            --label org.opencontainers.image.base.digest="$BASE_DIGEST" \
            -t "$IMAGE:stable" .

      # stable          moving: what the host tracks
      # MAJOR           moving: latest build on this Fedora major
      # stable-DATE     moving: last build of that day
      # VERSION         immutable: pin/rollback target
      - name: Push
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman push --digestfile digest "$IMAGE:stable"
          for tag in "$MAJOR" "stable-$DATE" "$VERSION"; do
            podman push "$IMAGE:stable" "$IMAGE:$tag"
          done

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # One signature on the digest covers every tag above.
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$IMAGE@$(cat digest)"
