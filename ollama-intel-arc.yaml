apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-model-cache
  namespace: ai-workloads
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama-intel
  namespace: ai-workloads
spec:
  serviceName: "ollama-intel"
  replicas: 1
  selector:
    matchLabels:
      app: ollama-intel
  template:
    metadata:
      labels:
        app: ollama-intel
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "16384"
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            - name: OLLAMA_KV_CACHE_TYPE
              value: "q8_0"
          resources:
            limits:
              gpu.intel.com/xe: 1
              memory: 12Gi
              cpu: "8"
            requests:
              gpu.intel.com/xe: 1
              memory: 4Gi
              cpu: "2"
          volumeMounts:
            - name: model-storage
              mountPath: /root/.ollama
          securityContext:
            privileged: true
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: ollama-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: ai-workloads
spec:
  type: LoadBalancer
  selector:
    app: ollama-intel
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP
